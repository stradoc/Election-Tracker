<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Presidential election results by state and county, with a what-if swing control and the tipping-point state."
    />
    <title>TippingPoint</title>
    <script>
      // Apply the saved (or system) colour theme before the first paint, so the page never
      // flashes the wrong theme. src/theme/useTheme.ts reads this attribute and owns toggling.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('tippingpoint:theme');
        } catch (e) {
          theme = null;
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
